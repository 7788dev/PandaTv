name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an existing version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = tag

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.ref_name }}
      signed-tv: true
    secrets:
      TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
      TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
      TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
      TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-dist
          path: .tmp/ci-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tv-dist
          path: .tmp/ci-dist
      - name: Verify both packages and create SHA256SUMS
        run: node scripts/ci-release.mjs checksums
        env:
          PANDA_RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish complete release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > .tmp/release.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('fs').readFileSync('.tmp/release.json')).isDraft) { console.error('Refusing to overwrite an already published release'); process.exit(1); }"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Panda $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" .tmp/ci-dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
